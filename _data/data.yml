experiences:
  title: Experiences
  info:
    - role: Research Engineer
      time: Nov 2023 - Present
      company: University of Edinburgh, Edinburgh, UK
      details: |
          - Led engineering for the Edinburgh Decentralisation Index, designing distributed ingestion and analytics pipelines across Bitcoin, Ethereum, Cardano, and Ripple — processing multi-TB of archival chain data.
          - Operated and maintained full archival nodes across 4 blockchain protocols, ensuring high-integrity, reproducible, and reliable data collection for published research.
          - Designed, documented, and built REST APIs and backend data services.
          - Delivered a public, production React/TypeScript interactive dashboard for decentralisation data exploration.
          - Reduced deployment friction by implementing CI/CD pipelines and observability tooling via GitHub Actions and containerised deployments.
    - role: Blockchain Lead
      time: Oct 2021 - Jun 2022
      company: Niftysplits, Remote (Contract)
      details: |
          - Architected distributed event-driven backend for an NFT gaming platform in TypeScript, handling real-time asset state tracking across blockchain events.
          - Designed and deployed ERC-721 and custom smart contracts using Hardhat and OpenZeppelin, covering minting, ownership, and gameplay mechanics.
          - Built REST and WebSocket APIs supporting live minting flows and in-game asset interactions.
          - Implemented blockchain indexing components reducing asset state query latency for frontend consumers.
    - role: Researcher
      time: Dec 2014 - Aug 2017
      company: NUI Galway, Insight Centre for Data Analytics, Galway, Ireland
      details: |
          - Built Java-based distributed microservices for a platform-agnostic IoT framework, designing the VITAL ontology-based interoperability layer enabling standardised data exchange across 10 EU partner organisations.
    - role: Software Engineer (Web & Mobile)
      time: 2011 - 2014
      company: Multiple companies, Pakistan & Remote
      details: |
          - Delivered client-facing web and mobile applications and internal tools across several software engineering roles, providing technical guidance in small-team settings.
    - role: Visiting Lecturer
      time: 2011 - 2014
      company: Bahauddin Zakariya University, Multan, Pakistan
      details: |
          - Taught undergraduate courses — including Object-Oriented Programming and Semantic Web — across the Department of Computer Science and the Department of Computer Engineering.

