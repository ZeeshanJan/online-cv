career-profile:
  title: Career Profile
  summary: |
    Software engineer with over ten years on the backend, plus enough frontend to ship complete products. Currently
    at the University of Edinburgh, running archival nodes for four blockchain networks and building the data
    pipelines, REST APIs and public React/TypeScript dashboard that sit on top of them. Before that, led
    smart-contract and backend work at an NFT startup. Based in Edinburgh, used to working independently in remote
    teams.
